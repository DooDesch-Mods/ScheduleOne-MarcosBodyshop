<link rel="stylesheet" href="app.css">

<div class="hud" id="hud">
  <div class="menu">
    <div class="banner">
      <div class="brand">
        <span class="marco">Marco's</span>
        <span class="shop">BODYSHOP</span>
      </div>
      <img class="banner-icon" src="i-wrench.png">
    </div>
    <div class="head">
      <span class="crumb" id="crumb"></span>
      <span class="count" id="count"></span>
    </div>
    <div class="list" id="list"></div>
    <div class="detail" id="detail"></div>
  </div>

  <div class="wallet">
    <span class="cash" id="cash"></span>
    <span class="vehicle" id="vehicle"></span>
  </div>

  <div class="keys">
    <div class="key"><div class="cap"><img src="i-updown.png"></div><span id="k-browse">Browse</span></div>
    <div class="key"><div class="cap"><img src="i-enter.png"></div><span id="k-buy">Buy</span></div>
    <div class="key"><div class="cap wide"><span>Esc</span></div><span id="k-back">Back</span></div>
  </div>

  <div class="flash" id="flash"></div>
</div>

<script src="app.js"></script>
